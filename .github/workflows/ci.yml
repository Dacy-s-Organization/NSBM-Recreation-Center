name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:pii
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.403
      - run: dotnet build desktop/RecCenter.Desktop/RecCenter.Desktop.csproj -c Release
      - name: Fail on vulnerable .NET packages
        shell: pwsh
        run: |
          $output = dotnet list desktop/RecCenter.Desktop/RecCenter.Desktop.csproj package --vulnerable --include-transitive
          $output
          if ($output -match "following vulnerable packages") { exit 1 }
